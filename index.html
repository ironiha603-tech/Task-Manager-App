<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager App</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1>タスク管理アプリ</h1>
        <p>簡単操作で日常のタスクを管理しよう</p>
    </header>

    
    <section class="main-container">
        <div class="top-section">
            <section class="detail-container">
                <h2>アプリの説明</h2>
                <p>タスクを入力してボタンを押すとタスクが追加されます。</p>
                <p>削除したいときはタスク横のボタンを押してください</p>
            </section>

            <section class="input-container">
                <h2>タスクの追加</h2>
                <input class="task-input" type="text" placeholder="タスクを入力">
                <button class="add-btn">タスクを追加</button>
                <button class="remove-btn">タスクをすべて削除</button>
            </section>
        </div>

        <section class="task-container">
            <h2>タスク一覧</h2>
        </section>
    </section>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
